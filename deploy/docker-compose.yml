services:
  voice-agent:
    build:
      context: ..
      dockerfile: Dockerfile.voice-agent
    image: discord-voice-control-plane/voice-agent:local
    env_file:
      - ${VOICE_AGENT_ENV_FILE:-voice-agent.env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
